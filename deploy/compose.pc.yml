# PC node (Linux x86): NameNode + DataNode + Spark master + 4 workers + history server + client (driver)
# + monitoring. Every container uses the PC's own network (network_mode: host), so the PC<->Mac traffic is plain
# LAN traffic with no overlay. The Mac side is deploy/compose.mac.yml (Docker Desktop with host networking enabled).
#
#   cp deploy/.env.example deploy/.env   # then edit (LAN IPs)
#   docker compose -f deploy/compose.pc.yml --env-file deploy/.env up -d
#
# Ports used on the PC (must be free): HDFS 8020/9870/9866/9864/9867, Spark 7077/8080/8081/18080/4040 + 7078-7080,
# node-exporter 9100, cAdvisor 8082, Prometheus 9090, Grafana 3000.
# SECURITY: Spark standalone and HDFS run WITHOUT authentication on your LAN. Only use on a network you trust,
# or restrict with a firewall to the Mac's address (e.g. `ufw allow from <MAC_LAN_IP>`).
name: compbench-pc

x-node-env: &node-env
  NODE_HOST: cb-pc
  MASTER_HOST: cb-pc
  # In standalone mode the worker's SPARK_LOCAL_DIRS overrides spark.local.dir: pin shuffle/spill to the volume.
  SPARK_LOCAL_DIRS: /spark-local

x-hosts: &hosts
  - "cb-pc:${PC_LAN_IP}"
  - "cb-mac:${MAC_LAN_IP}"

x-svc: &svc
  image: compbench:latest
  restart: unless-stopped
  network_mode: host
  extra_hosts: *hosts

services:
  namenode:
    <<: *svc
    container_name: cb-namenode
    command: ["namenode"]
    environment: *node-env
    volumes: ["hdfs-name:/hdfs/name"]

  datanode:
    <<: *svc
    container_name: cb-datanode-pc
    command: ["datanode"]
    environment: *node-env
    volumes: ["hdfs-data:/hdfs/data"]
    depends_on: [namenode]

  spark-master:
    <<: *svc
    container_name: cb-spark-master
    command: ["master"]
    environment: *node-env

  # The PC hosts FOUR identical workers (4 cores / 6 GB each, one 4-core / 5 GB executor per worker) = 16 cores,
  # the Mac hosts one. Spark standalone cannot size executors per worker, so a bigger PC is expressed as more
  # identical workers rather than one big one. Worker web UIs auto-increment from 8081.
  spark-worker-1: &pc-worker
    <<: *svc
    container_name: cb-spark-worker-pc-1
    command: ["worker"]
    cpus: 4
    mem_limit: 8g
    environment:
      <<: *node-env
      WORKER_CORES: "4"
      WORKER_MEMORY: "6g"
    volumes: ["spark-local:/spark-local", "spark-work:/spark-work"]
    depends_on: [spark-master]

  spark-worker-2:
    <<: *pc-worker
    container_name: cb-spark-worker-pc-2

  spark-worker-3:
    <<: *pc-worker
    container_name: cb-spark-worker-pc-3

  spark-worker-4:
    <<: *pc-worker
    container_name: cb-spark-worker-pc-4

  spark-history:
    <<: *svc
    container_name: cb-spark-history
    command: ["history"]
    environment: *node-env
    volumes: ["spark-events:/spark-events"]

  # Idle container used as the Spark driver: `docker exec cb-client spark-submit ...`
  client:
    <<: *svc
    container_name: cb-client
    command: ["client"]
    environment: *node-env
    volumes:
      - spark-events:/spark-events
      - ../spark-apps/target:/jars:ro
      - ../data:/data
      - ../results:/results

  # ---- monitoring ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cb-node-exporter-pc
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    pid: host
    # network devices that carry the PC<->Mac traffic: PC = enp7s0 (wired), Mac Docker VM = eth0
    command: ["--path.rootfs=/host", "--collector.netdev.device-include=^(enp7s0|eth0)$$"]
    volumes: ["/:/host:ro,rslave"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cb-cadvisor-pc
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    privileged: true
    command: ["--port=8082", "--docker_only=true", "--housekeeping_interval=2s", "--store_container_labels=false",
              "--whitelisted_container_labels=com.docker.compose.service"]
    healthcheck: {disable: true}   # the image probes :8080, but cAdvisor listens on :8082 here
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cb-prometheus
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=60d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cb-grafana
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
  hdfs-name:
  hdfs-data:
  spark-local:
  spark-work:
  spark-events:

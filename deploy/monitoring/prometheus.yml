# 2 s scrape interval so even the 1 GB runs (tens of seconds) get usable resolution.
# node-exporter  : host (PC kernel / Docker Desktop VM kernel) CPU, memory, disk I/O and the LAN interface
#                  (PC enp7s0, Mac VM eth0 -> the PC<->Mac traffic).
# cAdvisor       : per-container CPU / memory / block I/O (PC only: see compose.mac.yml).
global:
  scrape_interval: 2s
  scrape_timeout: 2s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["cb-pc:9100"]
        labels: {machine: pc}
      - targets: ["cb-mac:9100"]
        labels: {machine: mac}
  - job_name: cadvisor
    static_configs:
      - targets: ["cb-pc:8082"]
        labels: {machine: pc}
      - targets: ["cb-mac:8082"]
        labels: {machine: mac}

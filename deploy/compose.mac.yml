# Mac node (Docker Desktop, Apple silicon): DataNode + Spark Worker #2 + node-exporter + cAdvisor.
#
# REQUIRES Docker Desktop > Settings > Resources > Network > "Enable host networking": containers with
# network_mode: host then have their LISTENING ports exposed on the Mac's LAN address, so the PC can reach them.
# Only wildcard (0.0.0.0) listeners are forwarded -- hence `cb-mac` resolves to 0.0.0.0 INSIDE these containers:
# services bind the wildcard, local traffic stays on loopback, and the name `cb-mac` that they advertise to the PC
# resolves (on the PC) to the Mac's LAN IP.
#
# Docker Desktop settings (Settings > Resources): CPUs >= 8, Memory >= 10-11 GB, disk image >= 150 GB.
# Keep the Mac plugged in, Low Power Mode off, and run `caffeinate -dimsu` during experiments.
#
#   cp deploy/.env.example deploy/.env   # same values as on the PC
#   docker compose -f deploy/compose.mac.yml --env-file deploy/.env up -d
name: compbench-mac

x-node-env: &node-env
  NODE_HOST: cb-mac
  MASTER_HOST: cb-pc
  # In standalone mode the worker's SPARK_LOCAL_DIRS overrides spark.local.dir: pin shuffle/spill to the volume.
  SPARK_LOCAL_DIRS: /spark-local

x-hosts: &hosts
  - "cb-pc:${PC_LAN_IP}"
  - "cb-mac:0.0.0.0"

x-svc: &svc
  image: compbench:latest
  restart: unless-stopped
  network_mode: host
  extra_hosts: *hosts

services:
  datanode:
    <<: *svc
    container_name: cb-datanode-mac
    command: ["datanode"]
    environment: *node-env
    volumes: ["hdfs-data:/hdfs/data"]   # named volume (never a macOS bind mount)

  spark-worker:
    <<: *svc
    container_name: cb-spark-worker-mac
    command: ["worker"]
    cpus: 4
    mem_limit: 8g
    environment:
      <<: *node-env
      WORKER_CORES: "4"
      WORKER_MEMORY: "6g"
    volumes: ["spark-local:/spark-local", "spark-work:/spark-work"]

  # ---- monitoring: scraped by the Prometheus on the PC. On the Mac, "host" = the Docker Desktop VM. ----
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cb-node-exporter-mac
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    pid: host
    command: ["--path.rootfs=/host", "--collector.netdev.device-include=^(enp7s0|eth0)$$"]
    volumes: ["/:/host:ro"]   # no rslave: Docker Desktop's VM rejects it

  # NOTE: on Docker Desktop cAdvisor 0.49 cannot resolve container layers (containerd image store), so it only reports
  # the VM root cgroup here. Per-machine CPU therefore comes from node-exporter + the Spark event log, not cAdvisor.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cb-cadvisor-mac
    restart: unless-stopped
    network_mode: host
    extra_hosts: *hosts
    privileged: true
    command: ["--port=8082", "--docker_only=true", "--housekeeping_interval=2s", "--store_container_labels=false",
              "--whitelisted_container_labels=com.docker.compose.service"]
    healthcheck: {disable: true}   # the image probes :8080, but cAdvisor listens on :8082 here
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  hdfs-data:
  spark-local:
  spark-work:

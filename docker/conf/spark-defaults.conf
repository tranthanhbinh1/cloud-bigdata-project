# Pinned baseline for ALL experiments. Compression settings are NOT here: the harness
# passes them per run with --conf so every configuration shares this exact baseline.

spark.master                      spark://cb-pc:7077
spark.submit.deployMode           client

# Driver (client container on the PC). Fixed ports; the PC worker/executor share this network namespace.
spark.driver.host                 cb-pc
spark.driver.bindAddress          0.0.0.0
spark.driver.port                 7078
spark.driver.blockManager.port    7079
spark.blockManager.port           7080
spark.driver.memory               2g

# One 4-core / 5 GB executor per worker (worker memory 6g, container limit 8g) -> 8 cores total.
spark.executor.cores              4
spark.executor.memory             5g
spark.cores.max                   8

# Reproducibility: no adaptive behaviour that depends on shuffle sizes.
spark.sql.adaptive.enabled        false
spark.sql.shuffle.partitions      64
spark.sql.autoBroadcastJoinThreshold  -1
spark.speculation                 false
spark.dynamicAllocation.enabled   false

# Shuffle / spill files go to a dedicated volume (so shuffle disk I/O is measurable).
spark.local.dir                   /spark-local

# Event logs are written by the driver to a local volume shared with the history server.
spark.eventLog.enabled            true
spark.eventLog.dir                file:///spark-events
spark.eventLog.compress           false

spark.hadoop.fs.defaultFS         hdfs://cb-pc:8020
spark.hadoop.dfs.client.use.datanode.hostname true
